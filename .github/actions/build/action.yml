name: Build
description: Install dependencies and build into dist/.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
    - run: npm ci
      shell: bash
    - run: npm run build
      shell: bash
