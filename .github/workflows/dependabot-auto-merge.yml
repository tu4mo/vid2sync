name: Dependabot auto-merge

# pull_request_target gives the token write access on Dependabot PRs. Safe here
# because this workflow never checks out or runs the PR's code.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'tu4mo/vid2sync'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Major updates still need a review. Outputs are empty if the PR has
      # commits that aren't Dependabot's, so match the allowed types rather than
      # excluding major. The main ruleset holds the merge until CI passes.
      - if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
